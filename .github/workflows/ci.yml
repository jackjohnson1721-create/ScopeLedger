name: CI

on:
  push:
    branches: ["main", "claude/**", "phase/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Minimal envs so next build and zod-parsed modules load without crashing.
      # Real secrets live in Vercel / Supabase for preview + production.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci_only_00000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  schema-guard:
    name: Schema drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('artifacts/schema.json','utf8'))"
      - name: Ensure migration exists when schema changes (soft warn)
        run: |
          set -euo pipefail
          if git diff --name-only origin/main... | grep -q '^artifacts/schema.json$'; then
            if ! git diff --name-only origin/main... | grep -q '^supabase/migrations/'; then
              echo "::warning::schema.json changed but no new migration was added. Confirm this is intentional."
            fi
          fi
